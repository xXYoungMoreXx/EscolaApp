version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: escola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escola_db
      POSTGRES_USER: escola_user
      POSTGRES_PASSWORD: escola_secure_pass_2026
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U escola_user -d escola_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: escola-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: escola-backend
    restart: unless-stopped
    ports:
      - '3333:3333'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://escola_user:escola_secure_pass_2026@postgres:5432/escola_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: escola-jwt-secret-2026-change-in-production
      JWT_EXPIRES_IN: 1h
      PORT: 3333
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escola-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
