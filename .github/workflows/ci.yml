name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escola
          POSTGRES_PASSWORD: escola
          POSTGRES_DB: escola_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://escola:escola@localhost:5432/escola_db?schema=public
      JWT_SECRET: ci-secret-nunca-use
      JWT_EXPIRES_IN: 15m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (sharp inclui binário pré-compilado para Linux)
        run: npm ci

      - name: Migrations + seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start server (produção)
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then echo READY; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health > /dev/null

      - name: E2E auth
        run: node tests/e2e-auth.mjs

      - name: E2E core (rotinas)
        run: node tests/e2e-core.mjs
